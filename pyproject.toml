[project]
name = "shekel-sentry"
version = "0.1.0"
description = "This is a personal project meant to help me track personal finances while also learning Python."
requires-python = ">=3.14"

dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]